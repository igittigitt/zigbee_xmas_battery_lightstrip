## IDF Component Manager Manifest File
## Versions: see docs/zigbee-framework.md (decision 2026-11-07: esp-zigbee-lib 2.0.5, ESP-IDF 5.5.4)
dependencies:
  # Pinned exactly: 2.1.0 has a confirmed regression (esp-zigbee-sdk issue #942)
  # and changes the default Zigbee specification to r23.
  espressif/esp-zigbee-lib: "==2.0.5"
  # esp-zigbee-lib 2.0.5 release notes: "based on esp-idf v5.5.4"
  idf:
    version: "~5.5.4"
